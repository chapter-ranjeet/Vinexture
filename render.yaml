services:
  - type: web
    name: vinexture-backend
    runtime: python
    rootDir: backend
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: vinexture-db
          property: connectionString
      - key: FRONTEND_URL
        value: "https://vinexture.vercel.app"

databases:
  - name: vinexture-db
    databaseName: vinexture
    user: vinexture_user
    plan: free
